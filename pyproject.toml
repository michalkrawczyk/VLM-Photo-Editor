[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-photo-editor"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["vlm_photo_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# e2e needs a live browser + real API calls; opt in with `pytest -m e2e`
# (a -m on the command line overrides this one).
addopts = ["-m", "not e2e"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring full pipeline",
    "eval: planner/ops quality evals scored with ImageReport metric deltas; the deterministic tier is cheap and runs in the gate, the VLM tier is also marked slow (select with '-m eval')",
    "e2e: end-to-end browser tests against a live Streamlit server; real API calls, not run by default (select with '-m e2e')",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
strict = true
